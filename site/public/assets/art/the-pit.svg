<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A single column of light falling down the deep shaft of Cenote The Pit">
  <defs>
    <linearGradient id="pw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E97A8"/><stop offset=".22" stop-color="#0F5A72"/>
      <stop offset=".55" stop-color="#05283A"/><stop offset="1" stop-color="#010609"/>
    </linearGradient>
    <linearGradient id="pcol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6FFFD" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#BDF6EE" stop-opacity=".5"/>
      <stop offset=".68" stop-color="#6FD9DA" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6FD9DA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pwall" x1="0" y1="0" x2="1" y2=".3">
      <stop offset="0" stop-color="#030E15"/><stop offset="1" stop-color="#000406"/>
    </linearGradient>
    <filter id="pb" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
    <radialGradient id="pv" cx=".5" cy=".3" r=".85">
      <stop offset=".42" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".78"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#pw)"/>

  <!-- the single column -->
  <g filter="url(#pb)">
    <path d="M516 0 L684 0 L760 800 L440 800 Z" fill="url(#pcol)"/>
    <path d="M556 0 L644 0 L672 620 L528 620 Z" fill="url(#pcol)" opacity=".9"/>
  </g>

  <!-- converging shaft walls -->
  <path fill="url(#pwall)" d="M0 0 H330 C316 90 352 150 330 232 C312 300 348 352 328 428 C310 500 344 548 326 628 C312 694 340 740 328 800 H0 Z"/>
  <path fill="url(#pwall)" d="M1200 0 H880 C896 86 860 146 884 226 C902 294 866 348 888 422 C906 494 872 544 892 622 C906 690 878 738 890 800 H1200 Z"/>
  <g fill="url(#pwall)">
    <path d="M326 230 l16 108 12 -108z"/><path d="M324 428 l13 88 11 -88z"/>
    <path d="M320 624 l17 96 12 -96z"/><path d="M886 226 l14 100 12 -100z"/>
    <path d="M888 422 l16 112 12 -112z"/><path d="M890 620 l12 82 11 -82z"/>
  </g>

  <!-- haze bands / halocline hint deep down -->
  <path d="M300 556 C460 540 700 566 900 548" stroke="#9FE9E4" stroke-width="18" fill="none" opacity=".1" filter="url(#pb)"/>
  <path d="M320 640 C480 626 720 650 900 632" stroke="#C7A87A" stroke-width="22" fill="none" opacity=".09" filter="url(#pb)"/>

  <!-- tiny diver, far down the column, for scale -->
  <g transform="translate(556 452) rotate(14) scale(.72)" fill="#000406" opacity=".95">
    <ellipse cx="55" cy="20" rx="27" ry="7.6"/>
    <circle cx="81" cy="17" r="6.6"/>
    <rect x="43" y="8" width="21" height="9.4" rx="4.7"/>
    <path d="M75 21 q11 2 19 -1 l1.6 3.4 q-10 4.2 -20.6 1.2z"/>
    <path d="M29 19.4 l-17 -7.4 -2.2 4.2 14.8 6.4z"/>
    <path d="M29 21.6 l-17 7.4 -2.2 -4.2 14.8 -6.4z"/>
  </g>
  <g fill="#DFFAF4" opacity=".4">
    <circle cx="604" cy="424" r="2.4"/><circle cx="614" cy="392" r="1.8"/><circle cx="606" cy="358" r="3"/>
    <circle cx="620" cy="322" r="1.6"/><circle cx="612" cy="286" r="2.2"/>
  </g>
  <g fill="#EAFFFB" opacity=".3">
    <circle cx="500" cy="200" r="1.6"/><circle cx="660" cy="262" r="1.9"/><circle cx="572" cy="150" r="1.3"/>
    <circle cx="700" cy="180" r="1.5"/><circle cx="470" cy="330" r="1.4"/><circle cx="726" cy="400" r="1.6"/>
  </g>
  <rect width="1200" height="800" fill="url(#pv)"/>
</svg>
