name: Build and deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Check PHP syntax
        run: |
          for f in site/php/*.php site/php/lib/*.php; do php -l "$f"; done

      - name: Build the deploy bundle
        working-directory: site
        env:
          # Canonical URLs, hreflang, sitemap and Open Graph are baked in here.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          # Analytics and Search Console. Variables, not secrets: both values
          # end up in the served HTML for anyone to read, and a secret here
          # would only make them harder to check. Leave the provider empty and
          # no third-party script is emitted at all.
          NEXT_PUBLIC_ANALYTICS_PROVIDER: ${{ vars.ANALYTICS_PROVIDER }}
          NEXT_PUBLIC_ANALYTICS_ID:       ${{ vars.ANALYTICS_ID }}
          NEXT_PUBLIC_ANALYTICS_SRC:      ${{ vars.ANALYTICS_SRC }}
          NEXT_PUBLIC_GSC_VERIFICATION:   ${{ vars.GSC_VERIFICATION }}
        run: npm run build:deploy

      # OVH's shared hosting answers AUTH TLS with "500 This security scheme is
      # not implemented" — it does not do explicit FTPS. It does do SFTP, once
      # the box is ticked in the FTP-SSH tab, with the same credentials. Plain
      # FTP would also have worked and is not acceptable: it would put the
      # password on the wire in clear on every deploy.
      #
      # SamKirkland's action dropped SFTP, so this is lftp directly. lftp runs
      # SFTP through a real ssh, which cannot read a password without a
      # terminal — hence sshpass, which takes it from the environment rather
      # than from a command line other processes could read.
      #
      # `mirror --reverse --delete` makes the server match site/out exactly:
      # whatever left the build leaves the server. Both sides are entered with
      # lcd/cd and mirrored as "." — given a source path and a directory
      # target, lftp puts the source INSIDE the target, which is how the first
      # attempt created /www/out. cmd:fail-exit also means a wrong
      # FTP_SERVER_DIR stops at the cd instead of mirroring somewhere else.
      - name: Upload to OVH over SFTP
        env:
          SFTP_HOST:  ${{ secrets.FTP_SERVER }}
          SFTP_USER:  ${{ secrets.FTP_USERNAME }}
          SSHPASS:    ${{ secrets.FTP_PASSWORD }}
          SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          HOST_KEY:   ${{ vars.SFTP_HOST_KEY }}
        run: |
          set -eu
          test -n "$SFTP_HOST"  || { echo "::error::FTP_SERVER secret is empty";       exit 1; }
          test -n "$SFTP_USER"  || { echo "::error::FTP_USERNAME secret is empty";     exit 1; }
          test -n "$SSHPASS"    || { echo "::error::FTP_PASSWORD secret is empty";     exit 1; }
          test -n "$SERVER_DIR" || { echo "::error::FTP_SERVER_DIR variable is empty"; exit 1; }

          # Over FTP the user is chrooted and /www is its own root. Over SFTP
          # it is not: an absolute /www is the real filesystem root and does
          # not exist, which is what stopped the third attempt. The login
          # directory IS the account root — the same place kay-config.php
          # lives — so the target is taken relative to it.
          TARGET="${SERVER_DIR#/}"; TARGET="${TARGET%/}"
          # An empty target would mean the account root, and `mirror --delete`
          # there would delete kay-config.php along with everything else.
          test -n "$TARGET" || { echo "::error::FTP_SERVER_DIR resolves to the account root — refusing to mirror there"; exit 1; }
          echo "Deploying into ./$TARGET (from FTP_SERVER_DIR=$SERVER_DIR)"

          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp sshpass

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$HOST_KEY" ]; then
            # Pinned. Set the SFTP_HOST_KEY variable to one ssh-keyscan line and
            # the deploy refuses any server that answers with a different key.
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::SFTP_HOST_KEY is not set — the host key is trusted on first sight. Pin it once the first deploy has printed it."
            ssh-keyscan -t ed25519,rsa "$SFTP_HOST" > ~/.ssh/known_hosts 2>/dev/null
            echo "Host key seen (copy this into an SFTP_HOST_KEY variable to pin it):"
            cat ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "::error::no SSH host key for $SFTP_HOST — is SFTP enabled on the FTP user?"; exit 1; }

          # No credential is ever passed as an argument: ssh gets the password
          # from sshpass -e via the environment, and lftp is told it too so it
          # does not try to prompt on a terminal that is not there — without
          # that it warns "GetPass() failed" and falls back to anonymous.
          lftp -f /dev/stdin <<LFTP
          set sftp:connect-program "sshpass -e ssh -a -x -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=password"
          set net:max-retries 2
          set net:timeout 20
          set cmd:fail-exit yes
          # Every deploy used to serve a few seconds of 403: .htaccess sets
          # Options -Indexes, so while mirror was overwriting en/index.html in
          # place the directory had no index to serve and Apache refused the
          # request. Uploading to .in.<name> and renaming afterwards means the
          # live file is replaced instead of being absent while it transfers.
          #
          # Not strictly atomic: OpenSSH's sftp-server speaks protocol 3, whose
          # RENAME cannot overwrite, so lftp sends REMOVE then RENAME. The gap
          # is one round trip per file rather than the length of a transfer —
          # and Next's export rewrites every mtime, so mirror re-uploads the
          # whole site each time and that difference is the whole window.
          set xfer:use-temp-file yes
          open sftp://$SFTP_HOST
          user "$SFTP_USER" "$SSHPASS"
          lcd ./site/out
          cd $TARGET
          pwd
          mirror --reverse --delete --verbose=1 --no-perms --exclude '^\.well-known/' . .
          bye
          LFTP
