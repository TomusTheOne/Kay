name: Build and deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Check PHP syntax
        run: |
          for f in site/php/*.php site/php/lib/*.php; do php -l "$f"; done

      - name: Build the deploy bundle
        working-directory: site
        env:
          # Canonical URLs, hreflang, sitemap and Open Graph are baked in here.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build:deploy

      - name: Upload to OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/out/
          # The hosting carries three sites; this must point at the right one.
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          # kay-config.php lives ABOVE this directory and is never touched.
          # Anything listed here survives a deploy.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
